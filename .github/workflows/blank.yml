name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flet
        run: pip install flet
          
      - name: Build APK
        uses: flet-dev/flet-build-action@main
        with:
          target: android
          project_dir: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-calculadora-instalable
          path: build/apk/*.apk
